<div id="product-picker-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="Recherche de produit">
        <div class="picker-header">
            <h2>Rechercher un produit</h2>
            <button type="button" class="btn-secondary" data-picker-close>Fermer</button>
        </div>

        <div class="picker-controls">
            <input type="text" data-picker-s1 placeholder="Mot-clé (ex. chat)..." autocomplete="off" />
            <input type="text" data-picker-s2 placeholder="Recherche intelligente (optionnel)..." autocomplete="off" />
            <div class="picker-actions">
                <button type="button" class="btn" data-picker-b1>Rechercher</button>
            </div>
        </div>

        <div class="picker-list" data-picker-list></div>
    </div>
</div>
