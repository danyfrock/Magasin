<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs - Magasin</title>
    <!-- Styles globaux et grilles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/grille.css">
    <link rel="stylesheet" href="../css/utilisateurs.css">
    <!-- Tabulator CSS local -->
    <link href="../lib/tabulator/tabulator.min.css" rel="stylesheet">
</head>
<body>

    <div class="users-container">
        <header class="users-header">
            <div id="bandeau" data-title="Gestion des Utilisateurs"></div>
        </header>

        <!-- Formulaire de Création d'un Utilisateur -->
        <div class="card create-user-card">
            <h3 class="create-user-title">Créer un nouvel utilisateur</h3>
            <form id="create-user-form">
                <div class="user-form-grid">
                    <div class="form-group">
                        <label for="new-username">Nom d'utilisateur</label>
                        <input type="text" id="new-username" class="form-control" required placeholder="ex: jean.dupont">
                    </div>
                    <div class="form-group">
                        <label for="new-password">Mot de passe temporaire</label>
                        <input type="password" id="new-password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="new-role">Rôle</label>
                        <select id="new-role" class="form-control form-select">
                            <option value="Admin">Admin</option>
                            <option value="Caissier">Caissier</option>
                            <option value="Magasinier">Magasinier</option>
                        </select>
                    </div>
                    <button id="utilisateur-submit" type="submit" class="btn btn-primary btn-create-user">Créer</button>
                </div>
            </form>
            <div id="create-error" class="create-error"></div>
        </div>

        <!-- Tableau Tabulator -->
        <div id="users-table"></div>
    </div>

    <!-- Scripts de l'application -->
    <script src="../js/common.js"></script>
    <script src="../lib/tabulator/tabulator.min.js"></script>
    <script type="module" src="../js/utilisateurs.js"></script>
    <script src="../js/bandeau.js"></script>
    <script src="../js/permissions.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
