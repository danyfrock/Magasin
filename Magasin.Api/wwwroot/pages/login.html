<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Magasin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Connexion -->
        <section id="login-card" class="login-card">

            <h2>Connexion - Magasin</h2>

            <form id="login-form">

                <div class="form-group">
                    <label for="login-username">Nom d'utilisateur</label>
                    <input
                        type="text"
                        id="login-username"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="login-password">Mot de passe</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="login-password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="Afficher le mot de passe">
                            👁
                        </button>
                    </div>
                </div>

                <div id="login-error" class="error-message"></div>

                <button type="submit" class="btn btn-primary">
                    Se connecter
                </button>

            </form>

        </section>

        <!-- Premier changement de mot de passe -->
        <section id="password-card" class="login-card is-hidden">

            <h2>Changement requis</h2>

            <p class="login-subtitle">
                C'est votre première connexion.
                Veuillez modifier votre mot de passe temporaire.
            </p>

            <form id="password-form">

                <div class="form-group">
                    <label for="old-password">Ancien mot de passe</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="old-password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="Afficher le mot de passe">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="new-password">Nouveau mot de passe</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="new-password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="Afficher le mot de passe">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le nouveau mot de passe</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="confirm-password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="Afficher le mot de passe">
                            👁
                        </button>
                    </div>
                </div>

                <div id="password-error" class="error-message"></div>

                <button type="submit" class="btn btn-valider">
                    Mettre à jour
                </button>

            </form>

        </section>

    </div>

    <script type="module" src="../js/auth.js"></script>

</body>
</html>
