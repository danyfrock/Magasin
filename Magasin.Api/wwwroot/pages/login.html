<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Magasin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

    <div class="login-container">
        <!-- Formulaire de Connexion -->
        <div id="login-card" class="login-card">
            <h2>Connexion - Magasin</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Nom d'utilisateur :</label>
                    <input type="text" id="login-username" value="admin" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe :</label>
                    <input type="password" id="login-password" required>
                </div>
                <div id="login-error" class="error-message"></div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
        </div>

        <!-- Formulaire de Changement de Mot de Passe (Premier lancement) -->
        <div id="password-card" class="login-card" style="display:none;">
            <h2>Changement requis</h2>
            <p class="login-subtitle">C'est votre première connexion. Veuillez modifier votre mot de passe temporaire.</p>
            <form id="password-form">
                <div class="form-group">
                    <label for="old-password">Ancien mot de passe :</label>
                    <input type="password" id="old-password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Nouveau mot de passe :</label>
                    <input type="password" id="new-password" required>
                </div>
                <div id="password-error" class="error-message"></div>
                <button type="submit" class="btn btn-success">Mettre à jour</button>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
