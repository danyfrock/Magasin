<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des produits</title>
    <link rel="stylesheet" href="../lib/tabulator/tabulator.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/grille.css">
    <link rel="stylesheet" href="../css/produits.css">
</head>
<body>

    <div class="app">

        <a href="../index.html" class="back-link">← Retour au menu</a>
        <br>
        <h1>Gestion des produits</h1>

        <section class="form-section">
            <h2>Produit</h2>

            <form id="produit-form">
                <input type="hidden" id="produit-id">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="code-barre">Code-barres</label>
                        <input type="text" id="code-barre" readonly>
                    </div>

                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" required>
                    </div>

                    <div class="form-group prix-group">
                        <label for="prix">Prix</label>
                        <input type="number" id="prix" min="0" step="1" required>
                    </div>

                    <div class="form-group">
                        <label for="image">Image</label>
                        <input type="file" id="image" accept="image/*">
                    </div>

                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div id="image-preview-container" class="image-preview-container">
                    <span id="image-preview-empty">Aucune image</span>
                    <img id="image-preview" alt="Aperçu du produit">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Enregistrer
                    </button>

                    <button type="button" id="btn-annuler" class="btn btn-secondary">
                        Nettoyer
                    </button>
                </div>

                <div id="message-succes" class="message-succes">
                    ✓ Produit enregistré
                </div>
            </form>
        </section>

        <section class="card">
            <div class="liste-header">
                <h2>Produits</h2>

                <button type="button" id="btn-imprimer" class="btn btn-secondary">
                    Imprimer
                </button>
            </div>

            <div id="produit-table" class="grille"></div>
        </section>

    </div>

    <script src="../lib/tabulator/tabulator.min.js"></script>
    <script src="../js/produits.js"></script>
</body>
</html>
