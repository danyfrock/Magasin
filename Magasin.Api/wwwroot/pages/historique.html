<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/lib/tabulator/tabulator.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/grille.css">
    <link rel="stylesheet" href="../css/historique.css">

    <title>Historique des ventes - Magasin</title>
</head>
<body>

<div class="app">

    <a href="../index.html" class="back-link">← Retour au menu</a>

    <header class="header">
        <h1>Historique des ventes</h1>
    </header>

    <section class="card filtres-ventes">
        <h2>Filtrer les ventes</h2>

        <div class="filtres-ligne">

            <div class="filtre-groupe">
                <label for="type-periode">Période</label>

                <select id="type-periode">
                    <option value="">Toutes les dates</option>
                    <option value="jour">Jour</option>
                    <option value="mois">Mois</option>
                    <option value="annee">Année</option>
                </select>
            </div>

            <div class="filtre-groupe filtre-periode-valeur">
                <label for="valeur-periode">Date</label>

                <input
                    type="date"
                    id="valeur-periode">
            </div>

            <div class="filtre-groupe filtre-produit">
                <label for="produit">Produit</label>

                <input
                    type="text"
                    id="produit"
                    placeholder="Nom du produit">
            </div>

            <div class="filtre-actions">
                <button
                    type="button"
                    id="btn-imprimer"
                    class="btn-filtre-reset">
                    Imprimer
                </button>
            
                <button
                    type="button"
                    id="btn-reinitialiser"
                    class="btn-filtre-reset">
                    Réinitialiser
                </button>
            </div>

        </div>
    </section>

    <div class="layout">

        <section class="card">
            <h2>Ventes</h2>
            <div id="liste-ventes" class="grille"></div>
        </section>

        <section class="card">
            <h2>Détail de la vente</h2>

            <div id="detail-vide" class="empty">
                Cliquez sur une vente pour voir le détail
            </div>

            <div id="detail-contenu" class="detail-contenu">

                <div class="detail-informations">
                    <p>
                        <strong>Date :</strong>
                        <span id="detail-date"></span>
                    </p>

                    <p>
                        <strong>Total :</strong>
                        <span id="detail-total"></span>
                    </p>
                </div>

                <h3>Articles</h3>
                <div id="detail-lignes" class="grille"></div>

                <h3>Paiements</h3>
                <div id="detail-paiements" class="grille"></div>

            </div>
        </section>

    </div>
</div>

<script src="../js/common.js"></script>
<script src="/lib/tabulator/tabulator.min.js"></script>
<script src="../js/historique.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
