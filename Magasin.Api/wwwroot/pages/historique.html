<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des ventes - Magasin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .table-wrapper {
            max-height: 420px;
            overflow-y: auto;
        }

        tr.clickable {
            cursor: pointer;
        }

        tr.clickable:hover {
            background: #f1f5f9;
        }

        tr.selected {
            background: #dbeafe !important;
        }

        .empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 16px 0;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="app">

    <a href="../index.html" class="back-link">← Retour au menu</a>

    <header class="header">
        <h1>Historique des ventes</h1>
    </header>

    <div class="layout">

        <!-- ===== LISTE DES VENTES ===== -->
        <section class="card">
            <h2>Ventes</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Articles</th>
                            <th>Paiements</th>
                        </tr>
                    </thead>
                    <tbody id="liste-ventes">
                        <tr><td colspan="4" class="empty">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- ===== DÉTAIL ===== -->
        <section class="card">
            <h2>Détail de la vente</h2>

            <div id="detail-vide" class="empty">
                Cliquez sur une vente pour voir le détail
            </div>

            <div id="detail-contenu" style="display:none;">
                <p>
                    <strong>Date :</strong> <span id="detail-date"></span><br>
                    <strong>Total :</strong> <span id="detail-total"></span>
                </p>

                <h3 style="margin:16px 0 8px; font-size:1rem;">Articles</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Produit</th>
                                <th>Qté</th>
                                <th>Prix unit.</th>
                                <th>Sous-total</th>
                            </tr>
                        </thead>
                        <tbody id="detail-lignes"></tbody>
                    </table>
                </div>

                <h3 style="margin:16px 0 8px; font-size:1rem;">Paiements</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Moyen</th>
                                <th>Montant</th>
                            </tr>
                        </thead>
                        <tbody id="detail-paiements"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</div>

<script src="../js/historique.js"></script>
</body>
</html>
