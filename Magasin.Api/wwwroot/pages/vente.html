<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caisse - Magasin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/vente.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <div id="bandeau" data-title="Caisse du magasin"></div>
    </header>

    <main class="main">

      <!-- SCAN -->
      <section class="card card-scan">
        <h2>Recherche produit</h2>
        <input type="text" id="scan" placeholder="Scanne ou tape le code-barres" autofocus>
      </section>

      <!-- PANIER -->
      <section class="card card-panier">
        <h2>Panier</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Produit</th>
                <th>Prix</th>
                <th>Quantité</th>
              </tr>
            </thead>
            <tbody id="panier"></tbody>
          </table>
        </div>
        <div class="total-bar">
          Total : <span id="total">0 F</span>
        </div>
      </section>

      <!-- PAIEMENT -->
      <section class="card card-paiement">
        <h2>Paiement</h2>

        <div id="paiements-effectues" class="paiements-liste"></div>

        <div class="resume-paiement">
          <div class="resume-ligne">
            <span>Déjà payé</span>
            <strong id="dejaPaye">0 F</strong>
          </div>
          <div class="resume-ligne">
            <span>Reste à payer</span>
            <strong id="resteAPayer">0 F</strong>
          </div>
        </div>

        <div class="montant-group">
          <label for="montantPaye">Montant de ce paiement (devise caisse)</label>
          <input type="number" id="montantPaye" min="0" step="1" placeholder="0">
        </div>

        <div class="boutons-modes">
          <button id="payerEspeces" type="button" class="btn btn-mode">ESPÈCES (XOF)</button>
          <button id="payerAutreDevise" type="button" class="btn btn-mode">ESPÈCES AUTRE DEVISE</button>
          <button id="payerCarte" type="button" class="btn btn-mode">CARTE</button>
          <button id="payerAirtel" type="button" class="btn btn-mode">AIRTEL</button>
          <button id="payerMoov" type="button" class="btn btn-mode">MOOV</button>
        </div>

        <p id="ligneARendre" class="a-rendre" style="display:none;">
          À rendre : <span id="aRendre">0 F</span>
        </p>

        <div class="montant-group">
          <label for="montantRendu">Rendu</label>
          <input type="number" id="montantRendu" min="0" step="1" placeholder="0">
        </div>

        <div class="actions-vente">
          <button id="validerVente" type="button" class="btn btn-valider" disabled>
            VALIDER LA VENTE
          </button>
          <button id="annulerVente" type="button" class="btn btn-annuler">
            ANNULER
          </button>
          <label class="checkbox-centree">
            <input type="checkbox" id="imprimerTicketAuto" checked>
            <span>Imprimer le ticket de caisse automatiquement</span>
          </label>
        </div>
      </section>

    </main>
  </div>

  <!-- ===================== MODAL AUTRE DEVISE ===================== -->
  <dialog id="modalAutreDevise">
    <div class="card modal-content">
      <h3>Paiement en autre devise</h3>

      <currency-converter id="converterModal"></currency-converter>

      <div class="actions-modal" style="display:flex; gap:12px; margin-top:16px;">
        <button type="button" id="validerPaiementDevise" class="btn btn-valider">
          Valider ce paiement
        </button>
        <button type="button" id="annulerPaiementDevise" class="btn btn-annuler">
          Annuler
        </button>
      </div>
    </div>
  </dialog>

  <!-- Template optionnel (si tu veux éviter le fallback dans le JS) -->
  <template id="currency-converter-template">
    <div class="card converter-card">
      <div class="converter-row" style="display:flex; gap:12px; margin-bottom:12px;">
        <div class="montant-group" style="flex:1;">
          <label for="montant">Montant reçu</label>
          <input type="number" id="montant" value="100" step="any" min="0">
        </div>
        <div class="montant-group" style="flex:1;">
          <label for="from">Devise client</label>
          <select id="from" class="theme-selector" style="width:100%;"></select>
        </div>
        <div class="montant-group" style="flex:1;">
          <label for="to">Devise caisse</label>
          <select id="to" class="theme-selector" style="width:100%;"></select>
        </div>
      </div>
      <div class="converter-result" style="display:flex; justify-content:space-between; font-weight:700; border-top:2px solid var(--border); padding-top:8px;">
        <span>Équivalent caisse :</span>
        <strong id="result" style="color:var(--primary);">—</strong>
      </div>
    </div>
  </template>

  <script src="../js/common.js"></script>
  <script src="../js/ticket.js"></script>
  <script src="../js/currency-converter.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/bandeau.js"></script>
  <script src="../js/permissions.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
