name: Build and Release Magasin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Créer le vrai fichier secret à partir du secret GitHub
      - name: Create magasin.secret.json
        run: |
          New-Item -ItemType Directory -Force -Path Installer\resources
          @"
          {
            "ConnectionStrings": {
              "Magasin": "${{ secrets.MAGASIN_CONNECTION_STRING }}"
            }
          }
          "@ | Out-File -FilePath "Installer\resources\magasin.secret.json" -Encoding utf8
        shell: pwsh

      # 2. Setup .NET 10
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 3. Publier l'application (self-contained)
      - name: Publish .NET Application
        run: |
          dotnet publish Magasin.Api\Magasin.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o Installer\resources\MagasinPublish
        shell: pwsh

      # 4. Extraire la version depuis le fichier .iss
      - name: Get Version from Inno Setup
        id: get_version
        run: |
          $content = Get-Content "Installer\InstallMagasin.iss" -Raw
          if ($content -match '#define\s+MyAppVersion\s+"([^"]+)"') {
            $version = $Matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            Write-Host "Version trouvée : $version"
          } else {
            throw "Impossible de trouver #define MyAppVersion dans InstallMagasin.iss"
          }
        shell: pwsh

      # 5. Installer Inno Setup (via action → plus fiable que winget)
      - name: Setup Inno Setup
        uses: sbwvr/action-inno-setup@v1

      # 6. Compiler l'installeur
      - name: Compile Magasin Installer
        run: iscc "Installer\InstallMagasin.iss"
        shell: pwsh

      # 7. Créer la Release GitHub avec la vraie version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/output/InstallMagasin-*.exe
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: "Magasin v${{ steps.get_version.outputs.VERSION }}"
          body: |
            Release automatique de Magasin v${{ steps.get_version.outputs.VERSION }}
            (build #${{ github.run_number }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}